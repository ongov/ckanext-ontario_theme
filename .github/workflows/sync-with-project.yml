name: Sync with Project

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - closed

jobs:
  sync-with-project:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.EDS_GITHUB_APP_ID }}
          private-key: ${{ secrets.EDS_GITHUB_APP_PRIVATE_KEY }}
          owner: EDS-0042

      - name: Update Tracking Issues
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const body = context.payload.pull_request.body || "";

            // Find the "Issue(s) addressed" section
            const sectionMatch = body.match(
              /##\s*Issue\(s\)\s*addressed([\s\S]*?)(?:\n##|\s*$)/i
            );

            if (!sectionMatch) {
              core.info("No 'Issue(s) addressed' section found");
              return;
            }

            const sectionContent = sectionMatch[1];

            // Extract issue numbers from bullet points
            const issueMatches = [
              ...sectionContent.matchAll(/^[*-]\s*#(\d+)/gm)
            ];

            if (issueMatches.length === 0) {
              core.info("No issue references found");
              return;
            }

            const pr = context.payload.pull_request;
            const action = context.payload.action;

            let commentBody = "";

            if (action === "opened") {
              commentBody = `🔵 Pull Request Created

            **PR:** #${pr.number} ${pr.title}
            **Author:** @${pr.user.login}

            ${pr.html_url}`;
            } else if (action === "edited") {
              commentBody = `🟡 Pull Request Updated

            **PR:** #${pr.number} ${pr.title}

            The pull request details were updated.

            ${pr.html_url}`;
            } else if (action === "synchronize") {
              commentBody = `🟡 Pull Request Updated

            **PR:** #${pr.number} ${pr.title}

            New commits were pushed to this pull request.

            ${pr.html_url}`;
            } else if (action === "closed" && pr.merged) {
              commentBody = `🟢 Pull Request Merged

            **PR:** #${pr.number} ${pr.title}
            **Merged by:** @${pr.merged_by.login}

            ${pr.html_url}`;
            } else if (action === "closed") {
              commentBody = `⚪ Pull Request Closed

            **PR:** #${pr.number} ${pr.title}

            This pull request was closed without being merged.

            ${pr.html_url}`;
            }

            for (const match of issueMatches) {
              const issueNumber = parseInt(match[1], 10);

              await github.rest.issues.createComment({
                owner: "EDS-0042",
                repo: "odc-product",
                issue_number: issueNumber,
                body: commentBody
              });
              /*
              // Close issue automatically when PR is merged
              if (action === "closed" && pr.merged) {
                await github.rest.issues.update({
                  owner: "EDS-0042",
                  repo: "odc-product",
                  issue_number: issueNumber,
                  state: "closed"
                });
              }
              */

              core.info(`Updated issue #${issueNumber}`);
            }
